version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lumora_icp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # FIX: schema.sql was missing entirely before. Postgres auto-runs any
      # .sql file placed here on first container start, so the `leads` table
      # now gets created (and seeded) automatically - no manual psql step
      # needed to get a working database.
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: python scripts/run_enrichment.py --limit 10

volumes:
  postgres_data:
